.shell .location-intro{display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:55px}.shell .location-intro-copy p{font-size:15px;line-height:1.85;color:var(--body)}.shell .location-intro img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}.shell .selected-media{padding-top:52px;padding-bottom:58px}.shell .selected-media-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.shell .selected-media-grid figure{margin:0;background:var(--soft);border:1px solid var(--line)}.shell .selected-media-grid img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}.shell .selected-media-grid figcaption{font-size:11px;padding:14px;color:var(--body)}.shell .estate-section{background:var(--soft)}.shell .estate-grid{grid-template-columns:repeat(4,minmax(0,1fr))}.shell .estate-grid article{min-height:160px}.shell .estate-grid h3{font-size:19px}
.shell .nav-links{gap:clamp(8px,1.45vw,23px)}.shell .nav-links a{font-size:clamp(10px,.84vw,12px);white-space:nowrap}.shell .nav-links .nav-action{padding:12px 16px}.shell .nav-wrap .wordmark img{max-width:190px}
@media(max-width:1050px){.shell .offering-grid{gap:12px}.shell .nav-toggle{display:inline-flex}.shell .nav-wrap{position:relative}.shell .nav-links{display:none;position:absolute;top:100%;left:0;right:0;flex-direction:column;align-items:stretch;gap:0;background:var(--paper);padding:15px;border:1px solid var(--line);box-shadow:0 16px 40px #0003}.shell.cinematic .nav-links,.shell.motion .nav-links{background:#17181d}.shell .nav-links.is-open{display:flex}.shell .nav-links a{font-size:13px;padding:13px}.shell .location-intro{gap:25px}}
@media(max-width:800px){.shell .benefit-grid,.shell .offering-grid{grid-template-columns:1fr}.shell .estate-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.shell .location-intro{grid-template-columns:1fr}.shell .selected-media-grid{grid-template-columns:1fr 1fr}.shell .offering-tile img{height:265px}.shell .benefit-grid article{min-height:0}}
@media(max-width:550px){.shell .estate-grid,.shell .selected-media-grid{grid-template-columns:1fr}.shell .offering-tile img{height:205px}.shell .location-intro img{aspect-ratio:1/1}}

/* 2026 final art direction pass - focused premium story, original portrait sharpened not generated */
.shell .event-atmosphere{position:relative;min-height:420px;display:flex;align-items:center;overflow:hidden;color:#fff;background:#141519}
.shell .event-atmosphere>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 55%;filter:brightness(.78);transform:scale(1.005)}
.shell .event-atmosphere-shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(8,9,12,.91),rgba(8,9,12,.62) 45%,rgba(8,9,12,.04))}
.shell .event-atmosphere-copy{position:relative;z-index:2;padding:72px 0}
.shell .event-atmosphere h2{font-family:var(--head);font-size:clamp(31px,5vw,67px);line-height:1.1;letter-spacing:-.045em;max-width:840px;margin:16px 0 22px;color:#fff}
.shell .event-atmosphere p{font-size:14px;line-height:1.8;max-width:540px;margin:0 0 26px;color:#e2e2e4}
.shell .event-atmosphere .button{background:#f80032;color:white;border-color:#f80032}
.shell .portrait-stage img,.shell .founder-image img{filter:url(#portrait-crisp) contrast(1.025)!important;image-rendering:auto!important}
.shell .founder-image{max-width:490px}
.shell .founder-image img{object-position:50% 45%!important}
.shell .selected-media-grid img{aspect-ratio:16/10}
.shell .selected-media-grid figure:last-child:nth-child(3){display:none}
.shell .selected-media-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
.shell .home-offerings .offering-grid img{height:245px}
@media(max-width:650px){.shell .event-atmosphere{min-height:380px}.shell .event-atmosphere-copy{padding:58px 0}.shell .event-atmosphere-shade{background:linear-gradient(90deg,#090a0ceb,#090a0c88)}.shell .selected-media-grid{grid-template-columns:1fr}}

/* Distinctive venue storytelling – original media only, focus on atmosphere */
.shell .location-benefits{background:var(--soft);padding-top:66px;padding-bottom:68px}
.shell .location-benefit-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.shell .location-benefit-grid article{position:relative;padding:28px 26px;min-height:213px;border:1px solid var(--line);background:var(--paper)}
.shell .location-benefit-grid small{font-size:12px;letter-spacing:.15em;color:var(--accent);font-weight:800}
.shell .location-benefit-grid h3{margin:27px 0 12px;font-family:var(--head);font-size:clamp(19px,2vw,25px);line-height:1.2}
.shell .location-benefit-grid p{color:var(--body);font-size:13px;line-height:1.8;margin:0}
.shell .venue-visual-quote{min-height:480px;position:relative;display:flex;align-items:center;overflow:hidden;background:#101013;color:#fff}
.shell .venue-visual-image,.shell .venue-visual-overlay{position:absolute;inset:0}
.shell .venue-studio .venue-visual-image{background:url('assets/bavaria-event-night.webp') center 52%/cover no-repeat}
.shell .venue-estate .venue-visual-image{background:url('assets/moosschwaige-garden-event.webp') center 50%/cover no-repeat}
.shell .venue-visual-overlay{background:linear-gradient(90deg,rgba(5,7,12,.92),rgba(5,7,12,.54) 53%,rgba(5,7,12,.12))}
.shell .venue-visual-content{position:relative;z-index:1;padding:83px 0}
.shell .venue-visual-content h2{max-width:830px;font-family:var(--head);font-size:clamp(35px,5vw,68px);line-height:1.08;letter-spacing:-.045em;color:#fff;margin:15px 0 22px;text-wrap:balance}
.shell .venue-visual-content p{max-width:530px;color:#ebeaed;font-size:14px;line-height:1.9;margin:0 0 29px}
.shell .venue-visual-content .button{background:#f80032;color:white;border-color:#f80032}
.shell .selected-media-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
.shell .selected-media-grid figure:last-child{display:block}
.shell .selected-media-grid img{aspect-ratio:16/10;object-fit:cover}
@media(max-width:780px){.shell .location-benefit-grid{grid-template-columns:1fr}.shell .location-benefit-grid article{min-height:0}.shell .venue-visual-quote{min-height:420px}.shell .venue-visual-content{padding:64px 0}}
@media(max-width:600px){.shell .selected-media-grid{grid-template-columns:1fr}.shell .venue-visual-overlay{background:linear-gradient(90deg,rgba(5,7,12,.94),rgba(5,7,12,.54))}}

const processAndPerson=()=>`<section class="section process-section"><div class="wrap"><div class="process-heading">${label('So arbeiten wir')}<h2 class="section-title">Von der ersten Idee <span class="red">bis zum Event.</span></h2><p class="intro">Vom ersten Gespräch bis zum Eventtag wissen Sie, wer sich kümmert und wie es weitergeht.</p></div><div class="process-grid" aria-label="Vier Schritte Ihrer Eventplanung"><article><small>01 / KENNENLERNEN</small><h3>Wir hören zu.</h3><p>Anlass, Ziele, Gäste und Vorstellungen gemeinsam verstehen.</p></article><article><small>02 / KONZEPT</small><h3>Wir entwickeln Ideen.</h3><p>Ein passendes Format und die richtige Location finden.</p></article><article><small>03 / PLANUNG</small><h3>Wir koordinieren.</h3><p>Abläufe und Beteiligte aufeinander abstimmen.</p></article><article><small>04 / EVENTTAG</small><h3>Wir begleiten.</h3><p>Persönlich ansprechbar sein, wenn es darauf ankommt.</p></article></div></div></section><section class="section founder-section"><div class="wrap founder-layout"><div class="founder-image"><img src="assets/tobias-new.webp" width="1254" height="1254" alt="Tobias Fenzl – Gründer von TRANSFORM Events" loading="lazy"></div><div class="founder-copy">${label('Persönlich für Sie da')}<h2 class="section-title">Events sind persönlich.<br><span class="red">Die Zusammenarbeit auch.</span></h2><p>Ich bin Tobias Fenzl. Bei TRANSFORM Events verbinden sich meine Erfahrung aus der Eventbranche, ein offenes Ohr für Ihre Wünsche und der Anspruch, Veranstaltungen mit Charakter zu gestalten.</p><p>Sie haben eine erste Idee? Dann lassen Sie uns darüber sprechen – direkt und unkompliziert.</p><div class="btn-row">${btn('Tobias kennenlernen','ueber')}${btn('Gespräch anfragen','kontakt','ghost')}</div></div></div></section>`;
const homepageBenefits=()=>`<section class="section benefits-section"><div class="wrap"><div class="section-head">${label('Ihre Vorteile')}<h2 class="section-title">Sie erleben Ihr Event. <span class="red">Wir denken an die Details.</span></h2><p class="intro">Weniger Abstimmungsaufwand, kreative Ideen und ein persönlicher Ansprechpartner – für einen Ablauf, der zu Ihrem Team passt.</p></div><div class="benefit-grid"><article><small>01</small><h3>Persönlich betreut</h3><p>Direkte Abstimmung mit Tobias statt wechselnder Ansprechpartner.</p></article><article><small>02</small><h3>Individuell gestaltet</h3><p>Ein Konzept für Ihre Ziele, Gäste und den besonderen Anlass.</p></article><article><small>03</small><h3>Strukturiert begleitet</h3><p>Klare Schritte von der ersten Idee bis zur Umsetzung vor Ort.</p></article></div></div></section>`;
const homeOfferings=()=>`<section class="section home-offerings"><div class="wrap"><div class="section-head">${label('Wobei wir Sie unterstützen')}<h2 class="section-title">Ein Anlass. <span class="red">Viele Möglichkeiten.</span></h2><p class="intro">Zwei außergewöhnliche Locations und Eventformate, die Menschen verbinden. Entdecken Sie die Bereiche von TRANSFORM Events.</p></div><div class="offering-grid"><a class="offering-tile" href="${url('bavaria')}"><img src="assets/bavaria-event-night.webp" alt="Atmosphärische Veranstaltung in den Bavaria Studios" loading="lazy"><div><small>01 / EVENTLOCATION</small><h3>Bavaria Studios</h3><p>Filmreife Kulissen für Empfänge, Kick-offs und Markenmomente, die Eindruck hinterlassen.</p><span>Location entdecken ↗</span></div></a><a class="offering-tile" href="${url('moosschwaige')}"><img src="assets/moosschwaige-courtyard.webp" alt="Historischer Innenhof von Schlossgut Moosschwaige" loading="lazy"><div><small>02 / EVENTLOCATION</small><h3>Schlossgut Moosschwaige</h3><p>Historischer Charme, warmer Innenraum und grüne Außenbereiche für besondere Abende.</p><span>Location entdecken ↗</span></div></a><a class="offering-tile" href="${url('teamevents')}"><img src="assets/team-haka.webp" alt="Aktive Teilnehmer bei einem Teamevent" loading="lazy"><div><small>03 / TEAMKULTUR</small><h3>Teamevents</h3><p>Erlebnisse für Teams, die zusammenwachsen und gemeinsam etwas bewegen wollen.</p><span>Eventideen ansehen ↗</span></div></a></div></div></section>`;
const eventAtmosphere=()=>`<section class="event-atmosphere"><img src="assets/event-banquet-round.webp" alt="Stimmungsvoll gedeckte Tische bei einer Abendveranstaltung – Bild aus dem Eventportfolio" loading="lazy" decoding="async"><div class="event-atmosphere-shade"></div><div class="wrap event-atmosphere-copy">${label('Was am Ende bleibt')}<h2>Der Moment, über den<br>man noch lange spricht.</h2><p>Ein stimmiges Konzept entsteht nicht durch möglichst viele Programmpunkte, sondern durch die richtigen Details.</p>${btn('Tobias kennenlernen','ueber','ghost')}</div></section>`;
const homeFaq=()=>`<section class="section faq-home"><div class="wrap"><div class="section-head">${label('Gut zu wissen')}<h2 class="section-title">Ihre Fragen. <span class="red">Unsere Antworten.</span></h2></div><div class="faq-inline"><details><summary>Was brauche ich für eine erste Anfrage?</summary><p>Ein Anlass, ein ungefährer Zeitraum und die geplante Gästezahl reichen für den ersten Austausch. Weitere Details entwickeln wir gemeinsam.</p></details><details><summary>Begleitet TRANSFORM Events auch einzelne Leistungen?</summary><p>Welche Leistungen sinnvoll sind, hängt vom Projekt ab. Im Gespräch klären wir, welche Unterstützung Sie tatsächlich benötigen.</p></details><details><summary>Wann sollte ich die Planung beginnen?</summary><p>Idealerweise so früh wie möglich – besonders bei gefragten Terminen und Locations. Fragen Sie auch dann an, wenn Ihr Zeitplan noch offen ist.</p></details><details><summary>Welche Locations sind aktuell verfügbar?</summary><p>Die Verfügbarkeit von Bavaria Studios und Schlossgut Moosschwaige muss für Ihren konkreten Termin individuell bestätigt werden.</p></details></div></div></section>`;

function topbar(){return `<div class="preview-bar"><span class="preview-tag">TRANSFORM EVENTS · DESIGNVORSCHAU</span><nav class="preview-links" aria-label="Designvarianten"><a href="/">← Übersicht</a>${THEMES.map((t,i)=>`<a href="${url(page==='rechtliches'?'startseite':page,t.id)}" class="${t.id===design?'active':''}">0${i+1} ${t.name}</a>`).join('')}<button type="button" id="copy-link">↗ Link</button></nav></div>`}
function header(){return `<header class="site-header"><nav class="nav-wrap" aria-label="Hauptnavigation"><a class="wordmark" href="${url()}">${logo(design!=='afterglow')}</a><button type="button" class="nav-toggle" aria-expanded="false" aria-controls="main-navigation">☰ Menü</button><div class="nav-links" id="main-navigation">${[['startseite','Startseite'],['bavaria','Bavaria Studios'],['moosschwaige','Schlossgut Moosschwaige'],['teamevents','Teamevents'],['ueber','Über Tobias'],['kontakt','Event anfragen']].map(([p,n])=>`<a href="${url(p)}" class="${page===p?'active':''} ${p==='kontakt'?'nav-action':''}">${n}</a>`).join('')}</div></nav></header>`}
function footer(){return `<footer class="site-footer"><div class="wrap"><div class="footer-grid"><div><a class="wordmark" href="${url()}">${logo(true)}</a><p>TRANSFORM Events – persönlich konzipierte Veranstaltungen mit Charakter. Ihr Ansprechpartner: Tobias Fenzl.</p></div><div><h3>Entdecken</h3><a href="${url('bavaria')}">Bavaria Studios</a><a href="${url('moosschwaige')}">Schlossgut Moosschwaige</a><a href="${url('teamevents')}">Teamevents</a></div><div><h3>TRANSFORM</h3><a href="${url('startseite')}">Startseite</a><a href="${url('ueber')}">Über Tobias</a><a href="${url('kontakt')}">Event anfragen</a></div><div><h3>Kontakt</h3><a href="${url('kontakt')}">Anfrage vorbereiten ↗</a><a href="${url('rechtliches')}">Impressum & Datenschutz</a><p>Raum München · weitere Regionen auf Anfrage</p></div></div><div class="footer-bottom"><span>© 2026 TRANSFORM Events · Designkonzept</span><span>Designvorschau · Medienrechte, Rechtstexte und Kontaktdaten vor dem Livegang prüfen</span></div></div></footer>`}
function quickForm(){return `<form class="quick-form" id="quick-form"><div class="quick-form-grid"><input type="text" name="name" required autocomplete="name" aria-label="Name" placeholder="Name *"><input type="email" name="email" required autocomplete="email" aria-label="E-Mail-Adresse" placeholder="E-Mail *"><textarea name="message" required aria-label="Nachricht" placeholder="Erzählen Sie von Ihrem Event *"></textarea></div><button type="submit" class="button">Anfragetext vorbereiten <span class="arrow">→</span></button><p>Interaktive Design-Demo. Es wird nichts versendet oder gespeichert; Sie können den ausgefüllten Text kopieren.</p><div class="quick-form-result" id="quick-result" aria-live="polite"><strong>Ihre Anfrage:</strong><pre id="quick-output"></pre><button type="button" id="quick-copy">Text kopieren</button></div></form>`}
function cinematic(){return `<main class="home"><section class="cin-hero"><div class="wrap">${label('Ihr Event. Persönlich geplant.')}<h1>EVENTS, DIE<br>MENSCHEN<br><em>BEWEGEN.</em></h1><p>Sie genießen den Moment. TRANSFORM Events entwickelt und begleitet Ihr Event – mit besonderer Location, individuellen Ideen und persönlichem Einsatz.</p><div class="hero-buttons">${btn('Event besprechen')}${btn('Eventbereiche entdecken','bavaria','ghost')}</div></div><div class="cin-aside">BAVARIA STUDIOS<br>SCHLOSSGUT MOOSSCHWAIGE<br>TEAMEVENTS</div></section>${homeOfferings()}${eventAtmosphere()}${homepageBenefits()}${processAndPerson()}${homeFaq()}${finalCTA()}</main>`}
function editorial(){return `<main class="home"><section class="ed-hero"><div class="ed-hero-copy">${label('Persönliche Eventplanung bei München')}<h1>Besondere Anlässe.<br>Bleibende Eindrücke.</h1><div class="ed-rule"></div><p>Firmenevents, Teamerlebnisse und außergewöhnliche Locations – durchdacht geplant und persönlich begleitet.</p><div class="hero-buttons">${btn('Über Ihr Event sprechen')}${btn('Locations entdecken','bavaria','ghost')}</div></div><div class="ed-hero-photo" role="img" aria-label="Atmosphärische Veranstaltung"></div></section>${homeOfferings()}${eventAtmosphere()}${homepageBenefits()}${processAndPerson()}${homeFaq()}${finalCTA()}</main>`}
function motion(){return `<main class="home"><section class="mo-hero"><div class="wrap">${label('Events / Experiences / Emotions')}<h1>MAKE IT<br><em>MEMORABLE.</em></h1><p>Von der filmreifen Location bis zum Teamerlebnis: TRANSFORM Events gestaltet besondere Momente – ohne unnötige Komplexität, mit klarem Konzept.</p><div class="hero-buttons">${btn('Event anfragen')}${btn('Möglichkeiten entdecken','bavaria','ghost')}</div></div></section>${homeOfferings()}${eventAtmosphere()}${homepageBenefits()}${processAndPerson()}${homeFaq()}${finalCTA()}</main>`}

 Originalbilder mit ergänzend erzeugten Konzeptvisualisierungen.</p></div></section>${originalGallery('events','Menschen. Begegnungen. Emotionen.','Ausgewählte Originalbilder aus dem bereitgestellten Event- und Teameventportfolio.')}${finalCTA()}</main>`}

const locationBenefits=(kind)=>{const isStudio=kind==='bavaria';const items=isStudio?[['Filmische Kulisse','Ein Umfeld mit Charakter, Inszenierung und hohem Wiedererkennungswert.'],['Vielseitige Eventformate','Vom Kundenempfang über den Kick-off bis zur individuellen Markenpräsentation.'],['Raum für Markenmomente','Ein Rahmen, in dem Atmosphäre und die Geschichte Ihres Unternehmens zusammenfinden.']]:[['Historisches Ambiente','Warme Räume, historische Architektur und eine Atmosphäre zum Ankommen.'],['Innen & Außen','Stadl, Innenhof und Garten eröffnen unterschiedliche Perspektiven für Ihr Event.'],['Persönlicher Rahmen','Für Firmenabende, Empfänge und Begegnungen mit besonderer Stimmung.']];return `<section class="section location-benefits"><div class="wrap"><div class="section-head">${label(isStudio?'Was Bavaria besonders macht':'Was die Moosschwaige besonders macht')}<h2 class="section-title">${isStudio?'Nicht nur eine Location. <span class="red">Eine Bühne.</span>':'Mehr als eine Kulisse. <span class="red">Ein Gefühl.</span>'}</h2></div><div class="location-benefit-grid">${items.map(([title,description],i)=>`<article><small>0${i+1}</small><h3>${title}</h3><p>${description}</p></article>`).join('')}</div></div></section>`};

function bavaria(){return `<main class="page-main">${pageHero('Bavaria Studios','Events mit Bühne. <em>Marken mit Wirkung.</em>','Filmreife Kulissen und ein außergewöhnlicher Rahmen für Firmenveranstaltungen, die Eindruck hinterlassen sollen.')}<section class="section"><div class="wrap">${locationFeature('Bavaria Studios','assets/bavaria-filmset.webp','Wo sonst Filmwelten und große Geschichten entstehen, bekommt auch Ihr Event eine besondere Präsenz. Das Umfeld verbindet filmische Atmosphäre mit Raum für kreative Konzepte – vom Empfang über den Kick-off bis zur Markeninszenierung. Welche konkreten Flächen zur Verfügung stehen, klären wir persönlich.',['Corporate Events','Kundenempfänge','Kick-offs','Markeninszenierungen'])}</div></section>${locationBenefits('bavaria')}${visualQuote('bavaria')}${selectMedia('bavaria',[['bavaria-red-carpet.webp','Empfang & besondere Inszenierung'],['bavaria-stage-performers.webp','Bühne & Veranstaltungsatmosphäre']])}${locationFaq('bavaria')}${finalCTA()}</main>`}
function moosschwaige(){return `<main class="page-main">${pageHero('Schlossgut Moosschwaige','Ein Ort mit Atmosphäre. <em>Und Charakter.</em>','Historischer Charme, einladende Räume und grüne Außenbereiche für besondere Begegnungen und stilvolle Veranstaltungen.')}<section class="section"><div class="wrap">${locationFeature('Schlossgut Moosschwaige','assets/moosschwaige-aerial.webp','Schlossgut Moosschwaige ist ein Ort, an dem schon die Umgebung den Ton angibt. Historische Architektur, ein einladender Innenhof, warme Innenräume und Außenflächen schaffen einen besonderen Rahmen für Firmenfeiern, Empfänge und persönliche Anlässe. Welche Flächen konkret genutzt werden können, hängt von Termin und Rahmenbedingungen ab.',['Firmenfeiern','Sommerfeste','Empfänge','Business-Formate'])}<div class="media-video-actions"><button type="button" class="media-video-btn" data-video="impressionen">▶ Kurzfilm ansehen</button><button type="button" class="media-video-btn" data-video="rundgang">▶ Archiv-Rundgang ansehen</button></div><p class="media-archiv-hint">Archivvideo mit früherem Branding – Nutzungsrechte vor offizieller Verwendung prüfen.</p></div></section>${locationBenefits('moosschwaige')}<section class="section estate-section"><div class="wrap"><div class="section-head">${label('Das Anwesen entdecken')}<h2 class="section-title">Viele Bereiche. <span class="red">Ein besonderer Charakter.</span></h2><p class="intro">Vom Empfang im Innenhof bis zum gemeinsamen Abend im historischen Ambiente: Die Räume geben Ihrem Konzept eine eigene Stimmung.</p></div><div class="estate-grid">${[['Der Stadl','Rustikaler Charakter als Kulisse für besondere Zusammenkünfte.'],['Das Eventhaus','Räume für Austausch, Meetings und individuelle Veranstaltungsformate.'],['Der Innenhof','Eine einladende Atmosphäre für Empfänge und Begegnungen.'],['Der Obstgarten','Ein grüner Rahmen für sommerliche Ideen.']].map(([a,b])=>`<article><h3>${a}</h3><p>${b}</p></article>`).join('')}</div></div></section>${visualQuote('moosschwaige')}${selectMedia('moosschwaige',[['moosschwaige-courtyard.webp','Historischer Innenhof'],['moosschwaige-stadl-rustic.webp','Stadl mit Charakter']])}${locationFaq('moosschwaige')}${finalCTA()}</main>`}
function teamevents(){return `<main class="page-main">${pageHero('Teamevents & Teambuilding','Gemeinsam erleben. <em>Gemeinsam wachsen.</em>','Individuelle Teamformate, die Menschen zusammenbringen – mit Bewegung, Spaß und Raum für echte Begegnung.') }<section class="section"><div class="wrap">${locationFeature('Erlebnisse, die verbinden','assets/team-haka.webp','Ob aktiver Teamtag, gemeinsamer Workshop oder außergewöhnliches Incentive: Das richtige Format richtet sich nach Ihrem Team und dem gewünschten Ziel.',['Teamtage','Teambuilding','Incentives','Kick-offs'])}</div></section><section class="section estate-section"><div class="wrap"><div class="section-head">${label('Formate & Ideen')}<h2 class="section-title">Das Team steht im Mittelpunkt.</h2></div><div class="estate-grid"><article><h3>Aktiv & gemeinsam</h3><p>Bewegung, Challenges und ein gemeinsames Erlebnis.</p></article><article><h3>Spielerisch & entspannt</h3><p>Formate, die Menschen unkompliziert ins Gespräch bringen.</p></article><article><h3>Strategisch & motivierend</h3><p>Ein passender Auftakt für neue Ziele oder Veränderungen.</p></article></div></div></section>${selectMedia('events',[['team-boule.webp','Gemeinsames Boule-Erlebnis'],['team-haka.webp','Aktives Teamevent']])}${homeFaq()}${finalCTA()}</main>`}
function locations(){return `<main class="page-main">${pageHero('Eventlocations bei München','Die richtige Kulisse <em>macht den Unterschied.</em>','Bavaria Studios und Schlossgut Moosschwaige: zwei unterschiedliche Welten für Veranstaltungen mit unverwechselbarem Charakter.')}<section class="section"><div class="wrap"><div class="location-detail" id="bavaria"><div>${label('01 / Filmreife Atmosphäre')}<h2 class="section-title">Bavaria Studios</h2><p>Filmisches Ambiente und außergewöhnliche Eventflächen: Die Bavaria Studios eignen sich als ausdrucksstarker Rahmen für Firmenveranstaltungen, Markenauftritte und besondere Begegnungen. Welche Bereiche und Formate möglich sind, klären wir individuell.</p><div class="tags"><span>Corporate Events</span><span>Sommerfeste</span><span>Produktpräsentationen</span><span>Messebegleitende Events</span></div><div class="btn-row">${btn('Event in den Studios anfragen')}</div></div><div class="detail-photo" style="background-image:url('${PICS.studio}')" role="img" aria-label="Aufnahme einer Location in den Bavaria Studios"></div></div><div class="location-detail" id="moosschwaige"><div>${label('02 / Historisches Ambiente')}<h2 class="section-title">Schlossgut Moosschwaige</h2><p>Historisches Ambiente, grüne Außenbereiche und warme Innenräume geben dem Schlossgut Moosschwaige eine besondere Stimmung. Hier lassen sich persönliche Empfänge, Firmenfeiern und ausgewählte Business-Formate individuell denken – abhängig von Verfügbarkeit und Rahmenbedingungen.</p><div class="tags"><span>Tagungen & Workshops</span><span>Sommerfeste</span><span>Firmenfeiern</span><span>Empfänge</span></div><div class="btn-row">${btn('Event im Schlossgut anfragen')}</div><div class="media-video-actions"><button type="button" class="media-video-btn" data-video="impressionen" aria-label="Kurzfilm über Schlossgut Moosschwaige ansehen">▶ Kurzfilm ansehen</button><button type="button" class="media-video-btn" data-video="rundgang" aria-label="Archiv-Rundgang durch Schlossgut Moosschwaige ansehen">▶ Archiv-Rundgang</button></div><p class="media-archiv-hint">Archiv-Rundgang mit Branding der früheren Agentur · Rechte vor kommerzieller Nutzung freigeben.</p></div><div class="detail-photo" style="background-image:url('${PICS.manor}')" role="img" aria-label="Luftaufnahme Schlossgut Moosschwaige"></div></div><p class="photo-note">Die gezeigten Originalaufnahmen stammen aus dem bereitgestellten Bildportfolio. Bildrechte, Nutzungsberechtigung und aktuelle Verfügbarkeit der Locations sind vor einem öffentlichen Livegang beziehungsweise verbindlichen Angebot zu bestätigen.</p></div></section>${originalGallery('bavaria','Filmreife Eindrücke.','Originalaufnahmen aus dem bereitgestellten Bavaria-Portfolio.')}${originalGallery('moosschwaige','Schlossgut in Bildern.','Originalaufnahmen unterschiedlicher Räume und Außenbereiche.')}<section class="section" style="background:var(--soft)"><div class="wrap"><div class="section-head">${label('Schlossgut Moosschwaige')}<h2 class="section-title">Ein Anwesen. Viele Möglichkeiten.</h2><p class="intro">Die folgenden Bereiche werden in der bisherigen Locationbeschreibung genannt. Welche davon verfügbar und für Ihren Anlass geeignet sind, klären wir individuell.</p></div><div class="location-facilities">${[['Das Schloss','Historisches Ambiente für exklusive Begegnungen.'],['Das Eventhaus','Flexible Möglichkeiten für Meetings und Empfänge.'],['Der Stadl','Rustikaler Charakter für Feiern und Zusammenkünfte.'],['Die Jagdhütte','Ein privaterer Rahmen für kleinere Gruppen.'],['Der Obstgarten','Eine grüne Kulisse unter freiem Himmel.'],['Die Festwiese','Platz für größere Open-Air-Konzepte.'],['Der Innenhof','Einladender Treffpunkt auf dem Anwesen.'],['Die Allee','Ein besonderer erster Eindruck beim Empfang.']].map(([a,b])=>`<div class="facility"><strong>${a}</strong><p>${b}</p></div>`).join('')}</div></div></section>${finalCTA()}</main>`}
function about(){return `<main class="page-main">${pageHero('Über mich','Events sind persönlich. <em>Die Zusammenarbeit auch.</em>','Lernen Sie Tobias Fenzl kennen: Ihr persönlicher Ansprechpartner für Ideen, Planung und Umsetzung.')}<section class="section"><div class="wrap about-grid"><div>${label('Gründer / Tobias Fenzl')}<h2 class="section-title">Hallo, ich bin <span class="red">Tobias.</span></h2><p>Ich habe TRANSFORM Events gegründet, um meine Erfahrung aus der Eventbranche in eine eigene Agentur einzubringen – mit dem Anspruch, Veranstaltungen nicht nur zu organisieren, sondern spürbar zu machen.</p><p>Für mich beginnt gute Eventplanung mit Zuhören: Was ist der Anlass? Wen wollen Sie erreichen? Welche Stimmung soll entstehen? Und welcher Moment soll am Ende in Erinnerung bleiben?</p><p>Mit klarer Abstimmung, kreativen Ideen und einer zuverlässigen Organisation begleite ich Sie von der Planung bis zum Veranstaltungstag – persönlich, pragmatisch und mit Blick für das große Ganze.</p><div class="btn-row">${btn('Persönlich Kontakt aufnehmen')}</div></div><figure class="portrait-photo"><div class="portrait-stage"><img src="assets/tobias-new.webp" alt="Tobias Fenzl, Gründer von TRANSFORM Events" loading="lazy" decoding="async"></div><figcaption><strong>Tobias Fenzl</strong><span>Gründer von TRANSFORM Events</span></figcaption></figure></div></section><section class="section" style="background:var(--soft)"><div class="wrap"><div class="section-head">${label('Meine Arbeitsweise')}<h2 class="section-title">Drei Dinge, die <span class="red">zählen.</span></h2></div><div class="values-grid"><div class="value-card"><small>01 / PERSÖNLICH</small><h3>Kurze Wege</h3><p>Direkte Abstimmung, ehrliche Beratung und ein persönlicher Ansprechpartner von Anfang bis Ende.</p></div><div class="value-card"><small>02 / KREATIV</small><h3>Ideen mit Substanz</h3><p>Ein Konzept, das nicht nur gut aussieht, sondern Menschen erreicht, zur Marke passt und sinnvoll umgesetzt werden kann.</p></div><div class="value-card"><small>03 / ZUVERLÄSSIG</small><h3>Details im Blick</h3><p>Strukturierte Organisation und klare Absprachen – damit aus vielen Einzelteilen ein stimmiges Gesamterlebnis wird.</p></div></div></div></section>${finalCTA()}</main>`}
function contact(){return `<main class="page-main">${pageHero('Eventanfrage','Ihre Idee ist <em>unser Anfang.</em>','Ob konkreter Termin oder erste Überlegung: Erzählen Sie uns, welchen Anlass Sie planen und was Ihnen wichtig ist.')}<section class="section"><div class="wrap contact-grid"><div>${label('Persönlicher Kontakt')}<h2 class="section-title">Ein Gespräch. Viele Möglichkeiten.</h2><p>Ob Firmenfest, Eventlocation oder Teamevent: Für den Einstieg reichen Anlass, ungefähre Gästezahl und Wunschzeitraum. Gemeinsam klären wir Ziele, Möglichkeiten und den passenden Rahmen.</p><p style="margin-top:22px"><strong>Hinweis:</strong> Das Formular ist eine interaktive Design-Demo. Es verschickt keine Nachrichten und speichert keine persönlichen Angaben. Ein Text zum Kopieren wird ausschließlich in Ihrem Browser erstellt.</p></div><div class="contact-form"><h3>Ihre Eventanfrage</h3><p>Tragen Sie Ihre Angaben ein und kopieren Sie anschließend den Text für einen späteren Versand.</p><form id="contact-form"><div class="field-grid"><div class="field"><label for="contact-name">Name *</label><input id="contact-name" name="name" required autocomplete="name" placeholder="Vor- und Nachname"></div><div class="field"><label for="contact-email">E-Mail-Adresse *</label><input id="contact-email" name="email" type="email" required autocomplete="email" placeholder="name@unternehmen.de"></div><div class="field"><label for="contact-company">Unternehmen</label><input id="contact-company" name="company" autocomplete="organization" placeholder="Firmenname"></div><div class="field"><label for="contact-type">Veranstaltungsart</label><select id="contact-type" name="type"><option value="Noch offen">Noch offen</option><option>Firmenevent / Feier</option><option>Teamevent</option><option>Tagung / Kick-off</option><option>Bavaria Studios</option><option>Schlossgut Moosschwaige</option><option>Messe-Side-Event</option><option>Andere Idee</option></select></div><div class="field"><label for="contact-date">Wunschzeitraum</label><input id="contact-date" name="date" placeholder="z. B. Sommer 2027"></div><div class="field"><label for="contact-guests">Gästezahl</label><input id="contact-guests" name="guests" type="number" min="1" placeholder="z. B. 150"></div><div class="field full"><label for="contact-budget">Budgetrahmen (optional)</label><select name="budget" id="contact-budget"><option value="Noch offen">Noch offen</option><option>Bis 10.000 €</option><option>10.000–25.000 €</option><option>25.000–50.000 €</option><option>50.000–100.000 €</option><option>Über 100.000 €</option></select></div><div class="field full"><label for="contact-message">Was haben Sie vor? *</label><textarea id="contact-message" name="message" required placeholder="Erzählen Sie uns von Ihrem Anlass, dem Eventziel und Ihren Wünschen."></textarea></div></div><label class="demo-consent"><input type="checkbox" required>Ich verstehe, dass diese Design-Demo nichts versendet oder speichert.</label><button type="submit" class="button">Anfragetext erstellen <span class="arrow">→</span></button></form><div id="contact-result" class="demo-result" aria-live="polite"><strong>Ihre Anfrage zum Kopieren</strong><pre id="contact-output"></pre><button id="contact-copy" type="button">Text kopieren</button></div></div></div></section><section class="section" style="background:var(--soft)"><div class="wrap"><div class="section-head">${label('Gut zu wissen')}<h2 class="section-title">Häufige Fragen.</h2></div><div class="faq">${FAQ.map(([q,a])=>`<details><summary>${q}</summary><p>${a}</p></details>`).join('')}</div></div></section></main>`}
function legal(){return `<main class="page-main">${pageHero('Rechtliche Angaben','Impressum und <em>Datenschutz.</em>','Diese Angaben dienen bis zur Freigabe ausschließlich der Orientierung.')}<section class="section"><div class="wrap legal-copy"><h2>Impressum</h2><p>Die vollständigen Pflichtangaben der neuen Agentur TRANSFORM Events (inklusive Unternehmensbezeichnung, Anschrift, Kontakt und gegebenenfalls USt-ID) müssen vor dem Livegang von Tobias Fenzl ergänzt und rechtlich geprüft werden. Aus der bisherigen Agentur werden keine Impressumsangaben übernommen.</p><h2>Datenschutz</h2><p>Die finale Website benötigt eine Datenschutzerklärung, abgestimmt auf Hosting, Schriften, Bildquellen, Kontaktformulare, gegebenenfalls Analytics und die tatsächlich eingesetzten Dienste. Die Design-Demo versendet oder speichert keine Formulardaten.</p><h2>Bildmaterial & Urheberrecht</h2><p>Die Websitevorschau nutzt Aufnahmen aus dem von Auftraggeberseite bereitgestellten Bildportfolio. Eine Zuordnung als Referenz der neuen Agentur ist damit nicht verbunden. Rechte an Fotos, Marken und Werbematerial sind vor Veröffentlichung zu prüfen. Locationinformationen und Verfügbarkeit sind nicht verbindlich.</p><div class="btn-row">${btn('Zur Kontaktseite')}</div></div></section></main>`}
function initialize(){const root=document.getElementById('app');if(!design){document.title='TRANSFORM Events · Drei Websitekonzepte';root.innerHTML=selector();return}
 const theme=design==='pulse'?'cinematic':design==='afterglow'?'editorial':'motion';const views={startseite:design==='pulse'?cinematic:design==='afterglow'?editorial:motion,bavaria,moosschwaige,teamevents,ueber:about,kontakt:contact,rechtliches:legal};
 document.title=`${PAGES[page]} · TRANSFORM Events – ${THEMES.find(x=>x.id===design).name}`;
 root.innerHTML=`<div class="shell ${theme}">${topbar()}${header()}${(views[page]||views.startseite)()}${footer()}</div>`;
 const shell=root.querySelector('.shell');
 const requestType=new URLSearchParams(location.search).get('type');if(requestType){const select=root.querySelector('#contact-type');if(select&&Array.from(select.options).some(o=>o.value===requestType||o.textContent===requestType))select.value=requestType;}

 const toggle=root.querySelector('.nav-toggle'),nav=root.querySelector('.nav-links');toggle?.addEventListener('click',()=>{const opened=nav.classList.toggle('is-open');toggle.setAttribute('aria-expanded',String(opened));toggle.textContent=opened?'× Schließen':'☰ Menü'});
 const videoDialog=document.getElementById('media-video-dialog'),videoPlayer=document.getElementById('media-video-player');
 root.querySelectorAll('[data-video]').forEach(b=>b.addEventListener('click',()=>{
 const archive=b.dataset.video==='rundgang';
 const url=archive?'assets/schlossgut-rundgang-archiv.mp4':'assets/schlossgut-impressionen.mp4';
 const poster=archive?'assets/schlossgut-rundgang-archiv-poster.webp':'assets/schlossgut-impressionen-poster.webp';
 videoPlayer.pause();videoPlayer.poster=poster;videoPlayer.querySelector('source').src=url;videoPlayer.load();
 document.getElementById('media-video-title').textContent=archive?'Schlossgut – Archiv-Rundgang':'Schlossgut – Impressionen';
 document.getElementById('media-video-note').textContent=archive?'Archivmaterial mit sichtbarem Branding von VBA Events. Die Nutzungsrechte sind vor dem finalen Livegang zu prüfen.':'Originalvideo aus dem bereitgestellten Bild- und Filmpaket. Bild-, Film- und Musikrechte vor dem finalen Livegang prüfen.';
 videoDialog.showModal();videoPlayer.play().catch(()=>{});
 }));
 function closeVideo(){videoPlayer.pause();videoPlayer.querySelector('source').removeAttribute('src');videoPlayer.load();videoDialog.close()}
 document.getElementById('media-video-close')?.addEventListener('click',closeVideo);
 videoDialog?.addEventListener('click',e=>{if(e.target===videoDialog)closeVideo()});
 videoDialog?.addEventListener('close',()=>{videoPlayer.pause();videoPlayer.querySelector('source').removeAttribute('src');videoPlayer.load()});
 root.querySelector('#copy-link')?.addEventListener('click',async e=>{try{await navigator.clipboard.writeText(location.href);e.currentTarget.textContent='✓ Kopiert'}catch{prompt('Link kopieren:',location.href)}});
 root.querySelectorAll('[data-season]').forEach(b=>b.addEventListener('click',()=>{const season=b.dataset.season;root.querySelectorAll('[data-season]').forEach(x=>x.classList.toggle('active',x===b));const target=root.querySelector('#special-results');if(target)target.innerHTML=specialCards(season==='Alle'?SPECIALS:SPECIALS.filter(x=>x.season===season))}));
 const quick=root.querySelector('#quick-form');quick?.addEventListener('submit',e=>{e.preventDefault();if(!quick.reportValidity())return;const x=new FormData(quick);root.querySelector('#quick-output').textContent=`TRANSFORM Events · Design-Demo\n\nName: ${x.get('name')}\nE-Mail: ${x.get('email')}\nNachricht: ${x.get('message')}`;root.querySelector('#quick-result').classList.add('is-open')});
 root.querySelector('#quick-copy')?.addEventListener('click',async e=>{const t=root.querySelector('#quick-output').textContent;try{await navigator.clipboard.writeText(t);e.currentTarget.textContent='✓ Kopiert'}catch{prompt('Text kopieren:',t)}});
 const form=root.querySelector('#contact-form');form?.addEventListener('submit',e=>{e.preventDefault();if(!form.reportValidity())return;const f=new FormData(form);const data=[['Name',f.get('name')],['E-Mail',f.get('email')],['Unternehmen',f.get('company')],['Veranstaltung',f.get('type')],['Zeitraum',f.get('date')],['Gästezahl',f.get('guests')],['Budgetrahmen',f.get('budget')],['Nachricht',f.get('message')]].filter(x=>x[1]);root.querySelector('#contact-output').textContent='TRANSFORM Events · Design-Demo\n\n'+data.map(([k,v])=>k+': '+v).join('\n');root.querySelector('#contact-result').classList.add('visible');root.querySelector('#contact-result').scrollIntoView({behavior:'smooth',block:'nearest'})});
 root.querySelector('#contact-copy')?.addEventListener('click',async e=>{const t=root.querySelector('#contact-output').textContent;try{await navigator.clipboard.writeText(t);e.currentTarget.textContent='✓ Kopiert'}catch{prompt('Text kopieren:',t)}});
 const revealTargets=root.querySelectorAll('.page-hero,.service-detail,.location-detail,.special-card,.portfolio-photo,.value-card,.facility,.quick-form,.contact-form,.cin-location-wrap,.ed-location-grid,.mo-location-grid,.four-services .service-link,.season,.process-grid article,.founder-image,.founder-copy');
 revealTargets.forEach((el,i)=>{el.classList.add('reveal');el.style.setProperty('--reveal-delay',`${Math.min(i%6,5)*55}ms`)});
 if('IntersectionObserver' in window&&!window.matchMedia('(prefers-reduced-motion: reduce)').matches){const observer=new IntersectionObserver(entries=>{entries.forEach(entry=>{if(entry.isIntersecting){entry.target.classList.add('is-visible');observer.unobserve(entry.target)}})},{threshold:.08,rootMargin:'0px 0px -4% 0px'});revealTargets.forEach(el=>observer.observe(el))}else{revealTargets.forEach(el=>el.classList.add('is-visible'))}
 if(location.hash){const targetId=decodeURIComponent(location.hash.slice(1));requestAnimationFrame(()=>document.getElementById(targetId)?.scrollIntoView({block:'start'}))}
}
initialize();
})();
</script>
